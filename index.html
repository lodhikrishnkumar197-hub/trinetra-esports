<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>TRINETRA ESPORTS</title>
<style>
:root{color-scheme:light;--bg:#FFF6E5;--ink:#2A1B4D;--mut:#7a6b99;--pu:#7C3AED;--pk:#F43F5E;--go:#F5A524;--te:#14B8A6;--bl:#3B82F6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Impact,"Arial Black",system-ui,sans-serif;letter-spacing:.5px;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#fff;background:var(--pu);transition:transform .15s}
button:active{transform:scale(.96)}button.g{background:var(--go);color:var(--ink)}button.r{background:var(--pk)}button.t{background:var(--te)}button.l{background:#efe6ff;color:var(--pu)}
input,select{width:100%;padding:10px 12px;border:2px solid #e6dcff;border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:4px 0}
input:focus,select:focus{outline:none;border-color:var(--pu)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 20% 20%,#ffd9e2,transparent 40%),radial-gradient(circle at 80% 30%,#d9f7f1,transparent 40%),radial-gradient(circle at 50% 90%,#e6dcff,transparent 45%),var(--bg)}
.logo{font-size:clamp(40px,12vw,76px);background:linear-gradient(90deg,var(--pu),var(--pk),var(--go),var(--te),var(--pu));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.tag{color:var(--mut);margin:6px 0 22px;font-weight:700}.lb{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(90deg,var(--pu),var(--pk));color:#fff;position:sticky;top:0;z-index:5;border-radius:0 0 18px 18px}
header h2{font-size:20px}.role{background:#ffffff33;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
nav{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}nav button{white-space:nowrap}
.wrap{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(min-width:800px){.wrap.s{grid-template-columns:1.6fr 1fr}}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px #2a1b4d14;border-left:6px solid var(--c,var(--pu));margin-bottom:12px}
.tc{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:4px 0}
.chip{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;color:#fff;background:var(--te)}.chip.p{background:var(--pk)}.chip.m{background:var(--bl)}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pk);margin-right:6px;animation:pl 1.2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #f43f5e99}100%{box-shadow:0 0 0 10px #f43f5e00}}
.lr{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;margin:4px 0;background:#faf6ff;font-weight:700}
.lr:nth-child(2){background:#fff3d1}.lr:nth-child(3){background:#e8f1ff}.lr:nth-child(4){background:#ffe6ea}
.ann{background:#e6fbf7;border-left:5px solid var(--te);padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px}
.cm{padding:8px;border-radius:10px;background:#faf6ff;margin:6px 0;font-size:14px;word-break:break-word}.cm.pin{background:#fff3d1;border:2px solid var(--go)}
.modal{position:fixed;inset:0;background:#2a1b4d88;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;animation:up .3s}@keyframes up{from{transform:translateY(60px)}}
.room{background:linear-gradient(90deg,#e6fbf7,#fff3d1);border-radius:12px;padding:12px;font-weight:700;text-align:center}.room.lock{background:#f0eaff;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;z-index:30;animation:up .3s}
h3{font-size:18px;margin-bottom:8px;color:var(--pu)}small{color:var(--mut);font-weight:400}
.qr{display:block;width:150px;margin:8px auto;border-radius:12px}
.mg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.mi img,.mi iframe{width:100%;border-radius:12px;max-height:320px;aspect-ratio:16/9;object-fit:cover;border:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,addDoc,deleteDoc,updateDoc,getDoc,getDocs,onSnapshot,query,orderBy,serverTimestamp,increment}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCskKKU5SmDx9Spyk7HiMec3xTk79Ytg1A",authDomain:"trinetra-esports-686b9.firebaseapp.com",projectId:"trinetra-esports-686b9",storageBucket:"trinetra-esports-686b9.firebasestorage.app",messagingSenderId:"348018667542",appId:"1:348018667542:web:c94a0321c1171960728537"});
const auth=getAuth(app),db=getFirestore(app),ADMIN='762917802045@trinetra.app',RP=[12,9,8,7,6,5,4,3,2,1],COL=['#7C3AED','#F43F5E','#14B8A6','#F5A524','#3B82F6'];
let U=null,A=false,tab='home',T=[],LB=[],AN=[],CM=[],MD=[],mine=new Set(),roomUn=null,subbed=false,tt;
const $=id=>document.getElementById(id),v=id=>($(id)?.value||'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>ms?new Date(ms).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'Jald';
const ytid=u=>(u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/)||[])[1];
function toast(m){clearTimeout(tt);document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);tt=setTimeout(()=>d.remove(),2600)}
function modal(h){closeM();const d=document.createElement('div');d.className='modal';d.id='md';d.dataset.a='close';d.innerHTML=`<div class="sheet">${h}</div>`;document.body.appendChild(d)}
function closeM(){if(roomUn){roomUn();roomUn=null}$('md')?.remove()}
const sub=(c,ord,set)=>onSnapshot(ord?query(collection(db,c),orderBy(...ord)):collection(db,c),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>console.log(c,e.code));
function startSubs(){if(subbed)return;subbed=true;
 onSnapshot(query(collection(db,'tournaments'),orderBy('ts','desc')),async s=>{T=s.docs.map(d=>({id:d.id,...d.data()}));const m=new Set();await Promise.all(T.map(async t=>{try{if((await getDoc(doc(db,'tournaments',t.id,'bookings',U.uid))).exists())m.add(t.id)}catch{}}));mine=m;render()},e=>console.log(e.code));
 sub('leaderboard',null,x=>LB=x);sub('announcements',['ts','desc'],x=>AN=x);sub('comments',['ts','asc'],x=>CM=x);sub('media',['ts','desc'],x=>MD=x)}
onAuthStateChanged(auth,u=>{U=u;A=!!u&&u.email===ADMIN;if(u)startSubs();render()});
function render(){
 if(!U){$('app').innerHTML=`<div class="login"><h1 class="logo">TRINETRA<br>ESPORTS</h1><div class="tag">Compete. Dominate. Conquer.</div><div class="lb"><button class="g" data-a="gl">🎮 Google se Player Login</button><div class="card" style="text-align:left"><b>🛡️ Admin Login</b><input id="aid" inputmode="numeric" maxlength="12" placeholder="12 ank ki Admin ID"><input id="apw" type="password" maxlength="12" placeholder="12 akshar ka Password"><button data-a="al" style="width:100%;margin-top:6px">Admin Login</button></div></div></div>`;return}
 const tabs=A?[['home','Dashboard'],['add','Add Tournament'],['res','Results'],['media','Posters & Clips']]:[['home','Tournaments'],['my','My Bookings'],['media','Gallery']];
 $('app').innerHTML=`<header><h2>TRINETRA</h2><span class="role">${A?'ADMIN':'PLAYER'}</span><button class="l" data-a="out" style="padding:6px 12px">Logout</button></header><nav>${tabs.map(([k,n])=>`<button class="${tab===k?'g':'l'}" data-a="tab" data-i="${k}">${n}</button>`).join('')}</nav>${view()}`}
function tcard(t,i){const c=COL[i%5],pr=t.type==='practice',soon=A&&t.at&&t.at-Date.now()<=300000&&t.at-Date.now()>-3600000;
 return `<div class="card tc" style="--c:${c};animation-delay:${i*.06}s"><div class="row"><h3 style="margin:0;color:${c}">${esc(t.title)}</h3><span class="chip m">${esc(t.mode)}</span></div>
 <div class="row"><span><span class="live"></span>${fmt(t.at)}</span><span class="chip ${t.fee?'p':''}">${pr?'PRACTICE':t.fee?'₹'+esc(t.fee)+' Entry':'FREE'}</span></div>
 <div class="row"><b>${pr?'🎯 No entry • No prize':'🏆 Prize ₹'+esc(t.prize)}</b><small>${esc(t.slots)} slots</small></div>
 <div class="row"><button class="l" data-a="det" data-i="${t.id}">Details</button>${A?`<button class="${soon?'g':'t'}" data-a="rel" data-i="${t.id}">${soon?'⏰ Room Release karo':'Room Release'}</button><button class="r" data-a="del" data-i="${t.id}">Delete</button>`:mine.has(t.id)?'<span class="chip">✔ Booked</span>':`<button class="g" data-a="bk" data-i="${t.id}">Slot Book</button>`}</div></div>`}
function side(){const L=[...LB].sort((a,b)=>b.pts-a.pts);
 return `<div><div class="card" style="--c:#F5A524"><h3>🏅 Leaderboard</h3>${L.map((x,i)=>`<div class="lr"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(x.team)}</span><span>${esc(x.pts)}</span></div>`).join('')||'Abhi khali'}<small>Kill 1 point. Rank: 12/9/8/7/6/5/4/3/2/1</small></div>
 <div class="card" style="--c:#14B8A6"><h3>📢 Announcements</h3>${AN.map(a=>`<div class="ann">${esc(a.x)}${A?` <button class="r" style="padding:2px 8px" data-a="delan" data-i="${a.id}">x</button>`:''}</div>`).join('')||'Koi nahi'}${A?`<input id="an" placeholder="Nayi announcement"><button class="t" data-a="addan">Post</button>`:''}</div>
 <div class="card" style="--c:#F43F5E"><h3>💬 Comments</h3>${[...CM].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(c=>`<div class="cm ${c.pinned?'pin':''}">${c.pinned?'📌 ':''}<b>${esc(c.u)}:</b> ${esc(c.x)}${A?`<div style="margin-top:6px"><button class="g" style="padding:4px 10px" data-a="pin" data-i="${c.id}">${c.pinned?'Unpin':'Pin'}</button> <button class="r" style="padding:4px 10px" data-a="delc" data-i="${c.id}">Delete</button></div>`:''}</div>`).join('')}<input id="cmt" placeholder="Comment likho..."><button data-a="addc">Send</button></div></div>`}
function view(){
 if(tab==='home')return `<div class="wrap s"><div>${T.map(tcard).join('')||'<div class="card">Abhi koi tournament nahi.</div>'}</div>${side()}</div>`;
 if(tab==='my'){const m=T.filter(t=>mine.has(t.id));return `<div class="wrap">${m.map(tcard).join('')||'<div class="card">Abhi koi booking nahi.</div>'}</div>`}
 if(tab==='add'&&A)return `<div class="wrap"><div class="card"><h3>➕ Naya Tournament</h3><input id="n_t" placeholder="Tournament ka naam"><select id="n_m"><option>Solo</option><option>Duo</option><option selected>Squad</option></select><select id="n_f"><option value="practice">Practice Lobby (no entry, no prize)</option><option value="free">Free Tournament</option><option value="paid">Paid Tournament</option></select><input id="n_fee" type="number" placeholder="Entry fee ₹ (sirf paid)"><input id="n_p" type="number" placeholder="Prize pool ₹ (practice me nahi)"><input id="n_at" type="datetime-local"><input id="n_s" type="number" placeholder="Total slots"><small>Room ID aur Pass baad me Room Release se doge.</small><button class="g" data-a="addt" style="width:100%;margin-top:8px">Tournament Banao</button></div></div>`;
 if(tab==='res'&&A)return `<div class="wrap"><div class="card"><h3>📊 Result Daalo</h3><input id="r_t" list="tl" placeholder="Team name"><datalist id="tl">${LB.map(x=>`<option value="${esc(x.team)}">`).join('')}</datalist><input id="r_k" type="number" placeholder="Kills"><input id="r_r" type="number" min="1" max="10" placeholder="Rank (1-10)"><button class="t" data-a="addr" style="width:100%;margin-top:8px">Points Jodo</button></div></div>`;
 if(tab==='media')return `<div class="wrap">${A?`<div class="card"><h3>🖼️ Poster / Clip</h3><input id="m_u" placeholder="Image ya YouTube link paste karo"><input id="m_c" placeholder="Title (optional)"><button class="g" data-a="addm" style="width:100%;margin-top:8px">Add</button></div>`:''}<div class="mg">${MD.map(m=>`<div class="card mi">${ytid(m.url)?`<iframe src="https://www.youtube.com/embed/${ytid(m.url)}" allowfullscreen loading="lazy"></iframe>`:`<img src="${esc(m.url)}" alt="" loading="lazy">`}<div class="row"><b>${esc(m.cap)}</b>${A?`<button class="r" style="padding:4px 10px" data-a="delm" data-i="${m.id}">Delete</button>`:''}</div></div>`).join('')||'<div class="card">Abhi koi poster ya clip nahi.</div>'}</div></div>`;
 return ''}
const acts={
 close(i,b,e){if(e.target.id==='md')closeM()},
 async gl(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast('Login nahi hua: '+e.code)}},
 async al(){const id=v('aid');if(!/^\d{12}$/.test(id))return toast('12 ank ki ID daalo');try{await signInWithEmailAndPassword(auth,id+'@trinetra.app',$('apw').value)}catch(e){toast('Galat ID ya Password')}},
 out(){signOut(auth);tab='home'},
 tab(i){tab=i;render()},
 async det(id){const t=T.find(x=>x.id===id);
  modal(`<h3>${esc(t.title)}</h3><p>${esc(t.mode)} • ${fmt(t.at)} • ${t.type==='practice'?'Practice':'Prize ₹'+esc(t.prize)}</p><div class="room lock" id="room">...</div><h3 style="margin-top:12px">Booked Teams</h3><div id="bt">...</div><button class="l" data-a="close" data-x style="width:100%;margin-top:12px">Close</button>`);
  roomUn=onSnapshot(doc(db,'tournaments',id,'room','info'),s=>{const e=$('room');if(!e)return;if(s.exists()){e.className='room';e.innerHTML=`🔑 Room ID: <b>${esc(s.data().room)}</b> | Pass: <b>${esc(s.data().pass)}</b>`}else{e.className='room lock';e.textContent=A?'Abhi release nahi hua. Match se 5 min pehle Room Release dabao':'⏳ Admin match se 5 min pehle Room ID aur Pass dega'}},()=>{const e=$('room');if(e){e.className='room lock';e.textContent='🔒 Room ID sirf booked players ko dikhega'}});
  try{const s=await getDocs(collection(db,'tournaments',id,'bookings'));const e=$('bt');if(e)e.innerHTML=s.docs.map(d=>{const b=d.data();return `<div class="lr"><span>${esc(b.team)}</span>${A?`<small>${(b.pl||[]).map(p=>esc(p.name)+' '+esc(p.uid)).join(', ')} ${esc(b.utr||'')}</small>`:''}</div>`}).join('')||'Abhi koi nahi'}catch{}},
 bk(id){const t=T.find(x=>x.id===id);modal(`<h3>Slot Book: ${esc(t.title)}</h3><input id="b_t" placeholder="Team name">${[1,2,3,4].map(i=>`<div style="display:flex;gap:6px"><input id="u${i}" inputmode="numeric" placeholder="Player ${i} UID"><input id="f${i}" placeholder="FF naam"></div>`).join('')}${t.type==='paid'?`<div style="text-align:center"><b>₹${esc(t.fee)} QR se pay karo</b><img class="qr" src="qr.png" alt="" onerror="this.remove()"><input id="b_p" placeholder="Transaction ID (UTR)"></div>`:''}<button class="g" data-a="dobk" data-i="${id}" style="width:100%;margin-top:8px">Book Karo</button><button class="l" data-a="close" data-x style="width:100%;margin-top:8px">Cancel</button>`)},
 async dobk(id){const t=T.find(x=>x.id===id),team=v('b_t'),pl=[1,2,3,4].map(i=>({uid:v('u'+i),name:v('f'+i)}));
  if(!team||pl.some(p=>!p.uid||!p.name))return toast('Team name aur 4 players ke UID aur naam daalo');
  if(t.type==='paid'&&!v('b_p'))return toast('Payment ka Transaction ID daalo');
  try{await setDoc(doc(db,'tournaments',id,'bookings',U.uid),{team,pl,utr:v('b_p'),by:U.displayName||'',ts:serverTimestamp()});mine.add(id);closeM();render();toast('✅ Slot book ho gaya!')}catch(e){toast('Book nahi hua (pehle se booked ho sakta hai)')}},
 rel(id){const t=T.find(x=>x.id===id);modal(`<h3>Room Release: ${esc(t.title)}</h3><input id="rr" placeholder="Room ID"><input id="rp" placeholder="Room Pass"><button class="g" data-a="dorel" data-i="${id}" style="width:100%;margin-top:8px">Booked players ko dikhao</button><button class="l" data-a="hide" data-i="${id}" style="width:100%;margin-top:8px">Chhupa do</button>`)},
 async dorel(id){if(!v('rr')||!v('rp'))return toast('Room ID aur Pass dono daalo');try{await setDoc(doc(db,'tournaments',id,'room','info'),{room:v('rr'),pass:v('rp')});closeM();toast('Room booked players ko dikh raha hai')}catch{toast('Error: admin hi kar sakta hai')}},
 async hide(id){try{await deleteDoc(doc(db,'tournaments',id,'room','info'));closeM();toast('Room chhupa diya')}catch{toast('Error')}},
 async del(id){if(confirm('Tournament delete karein?'))try{await deleteDoc(doc(db,'tournaments',id))}catch{toast('Error')}},
 async addt(){const f=v('n_f'),pr=f==='practice',n=v('n_t'),p=pr?0:+v('n_p');if(!n||(!pr&&!p))return toast('Naam aur prize daalo');
  try{await addDoc(collection(db,'tournaments'),{title:n,mode:v('n_m'),type:f,fee:f==='paid'?(+v('n_fee')||20):0,prize:p,at:v('n_at')?new Date(v('n_at')).getTime():0,slots:+v('n_s')||12,ts:serverTimestamp()});tab='home';render();toast('🎉 Tournament ban gaya!')}catch{toast('Error: admin login chahiye')}},
 async addr(){const team=v('r_t').replace(/\//g,'-'),k=+v('r_k')||0,r=Math.min(Math.max(+v('r_r')||10,1),10);if(!team)return toast('Team name daalo');
  try{await setDoc(doc(db,'leaderboard',team),{team,pts:increment(k+RP[r-1])},{merge:true});tab='home';render();toast('Points jud gaye: '+(k+RP[r-1]))}catch{toast('Error')}},
 async addan(){if(!v('an'))return;try{await addDoc(collection(db,'announcements'),{x:v('an'),ts:serverTimestamp()})}catch{toast('Error')}},
 async delan(id){try{await deleteDoc(doc(db,'announcements',id))}catch{}},
 async addc(){if(!v('cmt'))return;try{await addDoc(collection(db,'comments'),{u:U.displayName||'Admin',x:v('cmt').slice(0,300),pinned:false,ts:serverTimestamp()})}catch{toast('Comment nahi gaya')}},
 async pin(id){const c=CM.find(x=>x.id===id);try{await updateDoc(doc(db,'comments',id),{pinned:!c.pinned})}catch{}},
 async delc(id){try{await deleteDoc(doc(db,'comments',id))}catch{}},
 async addm(){const u=v('m_u');if(!/^https?:\/\//.test(u))return toast('Sahi link paste karo (https://...)');try{await addDoc(collection(db,'media'),{url:u,cap:v('m_c'),ts:serverTimestamp()});toast('Add ho gaya')}catch{toast('Error')}},
 async delm(id){try{await deleteDoc(doc(db,'media',id))}catch{}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close'&&!b.dataset.x&&e.target.id!=='md')return;acts[b.dataset.a]?.(b.dataset.i,b,e)});
setInterval(()=>{if(U&&A&&!$('md')&&document.activeElement?.tagName!=='INPUT')render()},30000);
</script></body></html>
