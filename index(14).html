 x.strokeStyle='#2A1B4D44';x.lineWidth=2;x.fillStyle='#2A1B4Dcc';x.font='bold 26px sans-serif';x.textAlign='left';for(let i=1;i<4;i++){x.beginPath();x.moveTo(i*250,0);x.lineTo(i*250,W);x.moveTo(0,i*250);x.lineTo(W,i*250);x.stroke()}['A','B','C','D'].forEach((l,i)=>{x.fillText(l,i*250+8,30);x.fillText(String(i+1),6,i*250+60)});

 async sved(id){const team=v('b_t'),pl=[1,2,3,4,5].map(i=>({uid:v('u'+i),name:v('f'+i)})).filter((p,i)=>i<4||p.uid||p.name);if(!team||pl.some(p=>!p.uid||!p.name))return toast('Team name aur 4 players ke UID aur naam daalo');try{await updateDoc(doc(db,'tournaments',id,'bookings',U.uid),{team,pl});closeM();toast('Booking update ho gayi')}catch{toast('Edit nahi hua')}},
 async rmbk(i){const [tid,uid]=i.split('|');if(!confirm('Is team ko hata dein? Baad ke slot number badal jayenge.'))return;try{await deleteDoc(doc(db,'tournaments',tid,'bookings',uid));try{await deleteDoc(doc(db,'tournaments',tid,'proof',uid))}catch{}await loadBk();render();acts.det(tid);toast('Team hata di')}catch{toast('Error')}},
 async setm(id){const n=+v('nm');if(!n||n<1)return toast('Match ginti daalo');try{await updateDoc(doc(db,'tournaments',id),{matches:n});toast('Matches update ho gaye')}catch{toast('Error')}}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close'&&!b.dataset.x&&e.target.id!=='md')return;acts[b.dataset.a]?.(b.dataset.i,b,e)});
setInterval(()=>{if(U&&A&&!$('md')&&document.activeElement?.tagName!=='INPUT')render()},30000);
</script></body></html>
