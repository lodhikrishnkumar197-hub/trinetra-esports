function initMap(){const c=$('mc');if(!c)return;const pt=e=>{const r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*1000)]};

function tone(f,d=.12,type='sine',vol=.08,when=0,slide=0){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}

function btable(b,top){const R=[...(b.teams||[])].sort((x,y)=>tot(y)-tot(x)),L=top?R.slice(0,top):R,M=+b.matches||1;
 return `<div class="tw"><table class="bt"><tr><th>#</th><th>Team</th>${Array.from({length:M},(_,i)=>`<th>M${i+1}</th>`).join('')}<th>Total</th></tr>${L.map((t,i)=>`<tr><td><span class="rk" style="background:${medal[i]||'#2a2a38'};color:${i<3?'#1a1200':'#fff'}">${i+1}</span></td><td class="tn">${esc(t.name)}</td>${Array.from({length:M},(_,j)=>`<td>${esc((t.p||[])[j]??0)}</td>`).join('')}<td class="tt">${tot(t)}</td></tr>`).join('')||'<tr><td colspan="9">Abhi koi team nahi</td></tr>'}</table></div>`}
function bcom(b){const L=BC.filter(c=>c.bid===b.id).sort((x,y)=>(y.pinned?1:0)-(x.pinned?1:0));
 return `<h3 style="margin-top:12px">💬 Comments</h3>${L.map(c=>`<div class="cm ${c.pinned?'pin':''}">${c.pinned?'📌 ':''}<b>${esc(c.u)}:</b> ${esc(c.x)}${A?`<div style="margin-top:6px"><button class="g" style="padding:4px 10px" data-a="pinbc" data-i="${c.id}">${c.pinned?'Unpin':'Pin'}</button> <button class="r" style="padding:4px 10px" data-a="delbc" data-i="${c.id}">Delete</button></div>`:''}</div>`).join('')||'<small>Abhi koi comment nahi</small>'}<div class="row" style="flex-wrap:nowrap"><input id="bc_${b.id}" maxlength="300" placeholder="Comment likho..."><button data-a="addbc" data-i="${b.id}">Send</button></div>`}
function bcard(b){const o=openB===b.id,n=(b.teams||[]).length;
 return `<div class="card" style="--c:#F5B82E"><div class="row"><h3 style="margin:0">🏅 ${esc(b.name)}</h3><span class="chip m">${esc(b.matches)} match • ${n} teams</span></div>${btable(b,o?0:3)}<div class="row"><button class="${o?'l':'g'}" data-a="ob" data-i="${b.id}">${o?'Chhota karo':'Poora leaderboard + comments'}</button>${A?`<button class="t" data-a="ed" data-i="${b.id}">✏️ Points edit</button><button class="r" data-a="delbd" data-i="${b.id}">Delete</button>`:''}</div>${o?bcom(b):''}</div>`}
function edView(){const b=EDB,M=b.matches;

function collectEd(){const b=EDB;b.name=v('en')||b.name;b.teams=b.teams.map((t,i)=>({name:v('tn'+i),p:Array.from({length:b.matches},(_,j)=>{const x=parseFloat(v('pt'+i+'_'+j));return isNaN(x)?0:x})}))}
